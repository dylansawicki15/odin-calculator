<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <title>Calculator</title>
</head>
<body>
    
    <div class="container">
        <div class="calculator">
            <div class="display"></div>

            <div class="buttons">
                <button class="btn clear" data-key="Escape">Clear</button>
                <button class="btn backspace" data-key="Backspace">⌫</button>
                <button class="btn operator" data-op="divide" data-key="/">÷</button>
                <button class="btn operator" data-op="multiply" data-key="*">×</button>

                <button class="btn digit" data-key="7">7</button>
                <button class="btn digit" data-key="8">8</button>
                <button class="btn digit" data-key="9">9</button>
                <button class="btn operator" data-op="subtract" data-key="-">−</button>

                <button class="btn digit" data-key="4">4</button>
                <button class="btn digit" data-key="5">5</button>
                <button class="btn digit" data-key="6">6</button>
                <button class="btn operator" data-op="add" data-key="+">+</button>

                <button class="btn digit" data-key="1">1</button>
                <button class="btn digit" data-key="2">2</button>
                <button class="btn digit" data-key="3">3</button>
                <button class="btn equals" data-key="Enter">=</button>

                <button class="btn digit span-two" data-key="0">0</button>
                <button class="btn digit point" data-key=".">.</button>
            </div>
        </div>
    </div>
</body>
</html>
